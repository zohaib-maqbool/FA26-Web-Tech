<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-md bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">ShopEasy</a>
            <a href="#" class="cart">🛒</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h1 class="text-center mb-4">Featured Products</h1>
        <section class="product-grid" id="products">
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+1" alt="Product 1">
                <h3>Product 1</h3>
                <p>Rs. 1500</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+2" alt="Product 2">
                <h3>Product 2</h3>
                <p>Rs. 2000</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+3" alt="Product 3">
                <h3>Product 3</h3>
                <p>Rs. 2500</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+4" alt="Product 4">
                <h3>Product 4</h3>
                <p>Rs. 3000</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+5" alt="Product 5">
                <h3>Product 5</h3>
                <p>Rs. 3500</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+6" alt="Product 6">
                <h3>Product 6</h3>
                <p>Rs. 4000</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+7" alt="Product 7">
                <h3>Product 7</h3>
                <p>Rs. 4500</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <div class="product">
                <img src="https://placehold.co/300x200?text=Product+8" alt="Product 8">
                <h3>Product 8</h3>
                <p>Rs. 5000</p>
                <button class="btn btn-primary">Add to Cart</button>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
